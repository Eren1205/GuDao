:root{
  --serif:'Noto Serif SC','Songti SC','SimSun','STSong',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
  --radius:16px;
  --radius-sm:10px;
  --splash-light:#FFFFFF;
}
[data-theme="white"]{
  --bg:#F6F4F0; --card:#FFFFFF; --text:#221E1A; --sub:#8B8278; --faint:#BDB5A9;
  --line:#EAE5DC; --chip:#F0ECE5; --accent:#C1272D; --accent-soft:#F7E4E3;
  --up:#C1272D; --down:#1E7A4D; --down-soft:#E3F1E8; --shadow:0 1px 3px rgba(34,30,26,.05),0 8px 24px rgba(34,30,26,.04);
}
[data-theme="pink"]{
  --bg:#FBF6F7; --card:#FFFDFD; --text:#2A2126; --sub:#9C7F89; --faint:#C6AEB6;
  --line:#F3E4E8; --chip:#F7EBEE; --accent:#D95B7B; --accent-soft:#FBE7EC;
  --up:#D95B7B; --down:#2E7D5B; --down-soft:#E3F1E8; --shadow:0 1px 3px rgba(42,33,38,.05),0 8px 24px rgba(42,33,38,.04);
}
[data-theme="blue"]{
  --bg:#F5F8FB; --card:#FFFFFF; --text:#1D2733; --sub:#7C8D9D; --faint:#AEBBC7;
  --line:#E1E9F0; --chip:#EBF1F6; --accent:#2E6FAD; --accent-soft:#E6EFF7;
  --up:#2E6FAD; --down:#1E7A4D; --down-soft:#E3F1E8; --shadow:0 1px 3px rgba(29,39,51,.05),0 8px 24px rgba(29,39,51,.04);
}
[data-theme="green"]{
  --bg:#F4F8F5; --card:#FFFFFF; --text:#1E2A24; --sub:#7D9187; --faint:#AEBBB3;
  --line:#DFEBE4; --chip:#E9F1EC; --accent:#2C7A55; --accent-soft:#E5F1EA;
  --up:#C1272D; --down:#2C7A55; --down-soft:#E3F1EA; --shadow:0 1px 3px rgba(30,42,36,.05),0 8px 24px rgba(30,42,36,.04);
}
[data-theme="warm"]{
  --bg:#F6F1E6; --card:#FFFDF8; --text:#2B231B; --sub:#97836C; --faint:#C0AF97;
  --line:#EAE0CF; --chip:#EFE7D8; --accent:#B4532A; --accent-soft:#F6E7DB;
  --up:#B4532A; --down:#4E7A45; --down-soft:#E6F1E3; --shadow:0 1px 3px rgba(43,35,27,.05),0 8px 24px rgba(43,35,27,.04);
}
[data-theme="dark"]{
  --bg:#17181B; --card:#212327; --text:#EDEAE4; --sub:#9C9A95; --faint:#6B6A67;
  --line:#33353B; --chip:#2B2D32; --accent:#E2554F; --accent-soft:#3A2627;
  --up:#E2554F; --down:#4CAF7D; --down-soft:#1E3A2E; --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --splash-light:#202226;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--text); min-height:100%;
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.6;
  transition:background .3s ease,color .3s ease;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit;font-size:14px}
h1,h2,h3{font-family:var(--serif);font-weight:700}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ============ 布局骨架 ============ */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.seal{width:38px;height:38px;flex:none;border:2px solid var(--accent);border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:var(--serif);font-weight:900;font-size:22px;background:var(--accent-soft)}
.brand-name{font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:.12em}
.brand-sub{font-size:11px;color:var(--sub);letter-spacing:.18em;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--sub);font-size:14px;transition:all .2s;text-align:left;width:100%}
.nav-item svg{width:20px;height:20px;flex:none}
.nav-item:hover{background:var(--chip);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{padding:14px 8px 4px;font-size:11px;color:var(--faint);border-top:1px solid var(--line);letter-spacing:.08em}
.main{width:100%;max-width:1120px;margin:0 auto;padding:26px 36px 90px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;min-height:40px}
.topbar-left{display:flex;align-items:center;gap:10px}
.brand-mini{display:none;width:30px;height:30px;border-radius:8px;font-size:17px;border-width:1.6px}
.brand-mini-name{display:none;font-family:var(--serif);font-size:18px;font-weight:900;letter-spacing:.1em}
.topbar-title{font-family:var(--serif);font-size:19px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:12px}
.today-chip{font-size:12.5px;color:var(--sub);background:var(--chip);padding:5px 12px;border-radius:999px;letter-spacing:.05em}
.top-clock{font-size:12.5px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.icon-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--sub);border:1px solid var(--line);background:var(--card);transition:all .2s}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn svg{width:19px;height:19px}
.tabbar{display:none}
/* ============ 视图 ============ */
.view{display:none;animation:fadeIn .28s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-head{margin-bottom:20px}
.view-title{font-size:26px;font-weight:900;letter-spacing:.04em}
.view-sub{font-size:13px;color:var(--sub);margin-top:4px;letter-spacing:.04em}
/* ============ 卡片与通用组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.card-head .card-title{margin-bottom:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13.5px;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9;color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn-ghost:hover{background:var(--accent-soft)}
.btn-sm{padding:6px 13px;font-size:12.5px}
.btn-danger{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.btn-danger:hover{background:var(--accent);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2.5px 10px;border-radius:999px;font-size:11.5px;background:var(--chip);color:var(--sub);white-space:nowrap}
.tag-accent{background:var(--accent-soft);color:var(--accent)}
.tag-line{border:1px solid var(--line);background:transparent}
.progress{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 15px;border-radius:999px;font-size:12.5px;color:var(--sub);transition:all .2s}
.seg button.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.switch{display:inline-block;width:44px;height:26px;border-radius:13px;background:var(--chip);border:1px solid var(--line);position:relative;transition:all .2s;flex:none;cursor:pointer}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{left:20px}
.field{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card);outline:none;transition:border .2s}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:88px;line-height:1.7}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.form-label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-item{margin-bottom:14px}
.hint{font-size:12px;color:var(--faint);line-height:1.7;margin-top:6px}
.empty{text-align:center;padding:38px 22px;color:var(--sub)}
.empty .seal{width:64px;height:64px;border-radius:19px;font-size:34px;margin:0 auto 16px;border-width:2.4px}
.empty h3{font-size:17px;color:var(--text);margin-bottom:6px}
.empty p{font-size:13px;color:var(--sub);max-width:340px;margin:0 auto 18px;line-height:1.8}
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab-bar button{padding:9px 16px;font-size:14px;color:var(--sub);position:relative;transition:color .2s}
.tab-bar button.on{color:var(--accent);font-weight:600}
.tab-bar button.on::after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:2.4px;background:var(--accent);border-radius:2px}
mark.hl{background:var(--accent);color:#fff;padding:1px 6px;border-radius:5px}
/* ============ 首页 ============ */
.pnl-hero{display:flex;flex-direction:column;gap:2px}
.pnl-amount{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pnl-amount small{font-size:15px;font-weight:500;margin-right:4px}
.pnl-amount.sm{font-size:27px}
.pnl-pct{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.acct-card .pnl-amount{font-size:26px}
.acct-card .stat-grid{margin-top:12px;grid-template-columns:repeat(3,1fr)}
.acct-card .stat-card{padding:9px 14px}
.acct-card .stat-card .v{font-size:18px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sub)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-top:16px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat-card .k{font-size:12px;color:var(--sub)}
.stat-card .v{font-size:21px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.stat-card .v small{font-size:12px;font-weight:400;color:var(--faint);margin-left:2px}
.stat-card .v.mid{font-size:17px}
.quote-card{display:flex;align-items:center;gap:14px;padding:16px 20px}
.quote-mark{width:38px;height:38px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.quote-text{font-family:var(--serif);font-size:15.5px;letter-spacing:.05em;line-height:1.7}
.quote-cap{font-size:11px;color:var(--faint);margin-top:2px;letter-spacing:.12em}
.enter-card{display:flex;align-items:center;gap:14px;padding:16px 20px}
.enter-seal{width:34px;height:34px;flex:none;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:18px}
.enter-name{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.05em}
.enter-days{font-size:12.5px;color:var(--sub);margin-top:3px}
.enter-days b{color:var(--accent);font-size:15px;font-family:var(--serif)}
/* 大盘情绪 */
.senti-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.senti-tone{font-family:var(--serif);font-size:17px;font-weight:900;letter-spacing:.06em}
.senti-tone.up{color:var(--accent)}
.senti-tone.down{color:var(--down)}
.senti-tone.flat{color:var(--sub)}
.senti-amt{font-size:12px;color:var(--sub)}
.senti-amt b{font-size:13px;color:var(--ink)}
.senti-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--chip)}
.sb.up{background:var(--accent)}
.sb.down{background:var(--down)}
.sb.flat{background:#C9CDD4}
.senti-legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.senti-legend b{font-size:13px;color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.dot.up{background:var(--accent)}
.dot.down{background:var(--down)}
.dot.flat{background:#C9CDD4}
.senti-zt{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.zt-pill{font-size:12px;padding:4px 12px;border-radius:999px;letter-spacing:.05em}
.zt-pill b{font-size:14px}
.zt-pill.zt{background:var(--accent-soft);color:var(--accent)}
.zt-pill.dt{background:var(--down-soft);color:var(--down)}
.senti-rate{font-size:12px;color:var(--sub);margin-left:auto}
.senti-rate b{color:var(--ink)}
/* 消息面列表 */
.news-list{display:flex;flex-direction:column}
.news-row{cursor:pointer;padding:9px 2px;border-bottom:1px dashed var(--line);display:flex;align-items:baseline;gap:8px;line-height:1.6;flex-wrap:wrap}
.news-row:last-child{border-bottom:none}
.news-tm{font-size:11px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.news-t{font-size:13.5px;color:var(--ink);flex:1;min-width:0}
.news-row.imp .news-t{color:var(--accent);font-weight:700}
.news-tag{flex:none;font-size:10px;font-weight:700;color:#fff;background:var(--accent);padding:2px 7px;border-radius:4px;letter-spacing:.1em}
.news-dig{flex-basis:100%;font-size:12px;color:var(--sub);background:var(--chip);border-radius:8px;padding:8px 10px;margin:4px 0 6px;line-height:1.7}
.news-plain{white-space:pre-wrap;font-size:13px;line-height:1.9;color:var(--ink)}
/* AI 复盘 2x2 网格卡片 */
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.rv-card{position:relative;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;--rv-accent:var(--accent);transition:transform .15s ease,box-shadow .15s ease}
.rv-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.07)}
.rv-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rv-card-title{font-family:var(--serif);font-size:15.5px;font-weight:700;color:var(--rv-accent);display:flex;align-items:center;gap:8px;letter-spacing:.03em}
.rv-meta{font-size:11px;color:var(--faint)}
.rv-preview{font-size:12.5px;line-height:1.75;color:var(--sub);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.rv-more{font-size:12px;color:var(--rv-accent);font-weight:600;margin-top:auto;padding-top:4px;display:flex;align-items:center;gap:4px}
.rv-actions{display:flex;align-items:center;gap:8px;flex:none}
.lhb-nav{display:flex;align-items:center;gap:3px}
.lhb-nav button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1}
.lhb-nav button:disabled{opacity:.35;cursor:not-allowed}
.lhb-nav button:not(:disabled):hover{color:var(--rv-accent);border-color:var(--rv-accent)}
.lhb-date{font-size:11.5px;color:var(--sub);min-width:66px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:640px){.review-grid{grid-template-columns:1fr}}
/* 弹窗全文格式化 */
.modal.wide{max-width:760px}
.fmt-title{font-family:var(--serif);font-size:18px;font-weight:900;color:var(--rv-accent,var(--accent));letter-spacing:.04em;margin:6px 0 10px;line-height:1.5}
.fmt-sec{font-size:14.5px;font-weight:700;color:var(--rv-accent,var(--accent));margin:14px 0 6px;letter-spacing:.03em;font-family:var(--serif)}
.fmt-item{font-size:13.5px;color:var(--text);margin:4px 0;line-height:1.75}
.fmt-li{font-size:13px;color:var(--text);margin:3px 0;line-height:1.7}
.fmt-line{font-size:13px;color:var(--sub);margin:2px 0;line-height:1.7}
.fmt-risk{font-size:11.5px;color:var(--faint);margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.fmt-gap{height:6px}
/* ============ 持仓 ============ */
.hold-item{display:flex;gap:14px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
.hold-item:last-child{border-bottom:none}
.hold-main{flex:none;min-width:88px;max-width:150px}
.hold-name{font-family:var(--serif);font-size:15.5px;font-weight:700;cursor:pointer;transition:color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hold-name:hover{color:var(--accent)}
.hold-mv{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;margin-top:3px}
.hold-mv.up{color:var(--up)}
.hold-mv.down{color:var(--down)}
.hold-name.up{color:var(--up)}
.hold-name.down{color:var(--down)}
.hold-pnl-col{flex:1;display:flex;flex-direction:column;gap:2px;align-items:flex-end;font-variant-numeric:tabular-nums;min-width:56px}
.hold-pnl-amt{font-size:14px;font-weight:700}
.hold-pnl-pct{font-size:11.5px;font-weight:600;opacity:.85}
.hold-qty{flex:none;text-align:right;min-width:52px}
.hold-qty .k{font-size:11px;color:var(--faint)}
.hold-qty .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.hold-price{flex:none;text-align:right;min-width:62px;display:flex;flex-direction:column;gap:2px;align-items:flex-end;font-variant-numeric:tabular-nums}
.hold-price .k{font-size:11px;color:var(--faint)}
.hold-price .v{font-size:12.5px;font-weight:600}
.hold-clear{flex:none;padding:6px 10px;font-size:12px}
/* ============ 股票搜索 ============ */
.stk-results{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:11px;margin-top:8px}
.stk-item{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .15s}
.stk-item:last-child{border-bottom:none}
.stk-item:hover{background:var(--accent-soft)}
.stk-item.on{background:var(--accent-soft)}
.stk-item.on .stk-n{color:var(--accent)}
.stk-n{font-weight:500}
.stk-m{font-size:11px;color:var(--faint)}
.stk-sel{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:11px;padding:10px 14px;margin-top:10px}
.stk-sel .nm{font-family:var(--serif);font-weight:700;color:var(--accent);font-size:15px}
/* ============ 任务 ============ */
.task-item{display:flex;gap:13px;align-items:flex-start;padding:13px 2px;border-bottom:1px solid var(--line)}
.task-item:last-child{border-bottom:none}
.task-check{width:23px;height:23px;border-radius:50%;border:2px solid var(--faint);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:transparent}
.task-check svg{width:13px;height:13px;color:#fff;opacity:0;transition:opacity .2s}
.task-check.on{background:var(--accent);border-color:var(--accent)}
.task-check.on svg{opacity:1}.idx-row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.idx-row:last-child{border-bottom:0}
.idx-row:hover{background:var(--chip)}
.idx-name{flex:1;font-size:14px;font-weight:600}
.idx-price{font-family:var(--serif);font-size:15px;font-weight:700;width:92px;text-align:right}
.idx-pct{width:76px;text-align:right;font-size:12.5px;font-weight:600}
.kline-info{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--sub);margin-bottom:10px;align-items:baseline}
.kline-info b{font-family:var(--serif);font-size:17px;color:var(--text);margin-right:2px}
.review-content{white-space:pre-wrap;font-size:13.5px;line-height:1.8;color:var(--text);word-break:break-word}
.review-meta{font-size:11.5px;color:var(--faint);margin-bottom:8px}
.task-main{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:500;line-height:1.5}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.task-done .task-title{color:var(--faint);text-decoration:line-through}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.prio-high{background:var(--accent)}
.prio-mid{background:#D9A441}
.prio-low{background:#9AA5AD}
.task-actions{display:flex;gap:6px;flex:none}
.mini-btn{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--faint);border:1px solid var(--line);transition:all .2s;background:transparent}
.mini-btn:hover{color:var(--accent);border-color:var(--accent)}
.mini-btn svg{width:15px;height:15px}
.wd-chips{display:flex;gap:6px;flex-wrap:wrap}
.wd-chip{width:36px;height:36px;border-radius:50%;border:1.6px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--sub);transition:all .2s;background:var(--card)}
.wd-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tm-item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.tm-item:last-child{border-bottom:none}
.tm-main{flex:1;min-width:0}
/* ============ 分析页 ============ */
.cal-grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11.5px;color:var(--faint);padding:6px 0;font-weight:500}
.cal-day{position:relative;aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--text);border:1px solid transparent;transition:all .15s;cursor:pointer}
.cal-day:hover{border-color:var(--line)}
.cal-day.other{color:var(--faint)}
.cal-day.today{border-color:var(--accent);font-weight:700}
.cal-day.sel{background:var(--accent);color:#fff}
.cal-day.sel .pnl-cell{color:#fff}
.pnl-cell{font-size:10.5px;font-variant-numeric:tabular-nums;margin-top:1px;font-weight:600;line-height:1.2}
.cal-cell{min-height:72px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.cal-cell .k{font-size:12px;color:var(--faint)}
.cal-cell .v{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-cell.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cal-grid12{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.year-list .cal-cell{flex-direction:row;align-items:center;justify-content:space-between;min-height:52px}
.pnl-detail-row{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.pnl-detail-row:last-child{border-bottom:none}
/* ============ 计时 ============ */
.timer-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.timer-card{text-align:center;padding:26px 20px}
.timer-badge{display:inline-block;padding:4px 14px;border-radius:999px;font-size:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.1em}
.timer-badge.rest{background:rgba(30,122,77,.12);color:var(--down)}
.timer-display{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;margin:16px 0 6px;letter-spacing:.02em;font-family:var(--serif)}
.timer-sub{font-size:12px;color:var(--faint);letter-spacing:.1em;margin-bottom:18px}
.timer-btns{display:flex;justify-content:center;gap:10px}
.timer-btns .btn{padding:11px 26px;font-size:14px}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.chart-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 10px;box-shadow:var(--shadow)}
.chart-box h3{font-size:15px;font-weight:700;padding:2px 4px 6px}
.chart-box .chart{width:100%;min-height:300px}
/* ============ 日记 ============ */
.mood-track{display:flex;align-items:center;gap:12px}
.mood-track input[type=range]{flex:1;accent-color:var(--accent)}
.mood-val{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--accent);width:52px;text-align:center;font-variant-numeric:tabular-nums}
.diary-item{border-bottom:1px solid var(--line);padding:12px 2px}
.diary-item:last-child{border-bottom:none}
.lazy-sentinel{text-align:center;color:var(--faint);font-size:12px;padding:14px 0 4px;letter-spacing:.1em}
.lazy-end{text-align:center;color:var(--faint);font-size:12px;padding:14px 0 2px;letter-spacing:.1em}
/* ============ 笔记 ============ */
.note-toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.note-search{flex:1;min-width:200px;position:relative}
.note-search input{padding-left:38px}
.note-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.filter-chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-toggle{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--sub);background:var(--card);transition:all .2s}
.chip-toggle.on{background:var(--accent);border-color:var(--accent);color:#fff}
.note-item{display:flex;gap:13px;padding:15px 2px;border-bottom:1px solid var(--line)}
.note-item:last-child{border-bottom:none}
.note-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.note-stock{font-family:var(--serif);font-size:15.5px;font-weight:700}
.note-date{font-size:12px;color:var(--faint)}
.note-content{font-size:13.5px;line-height:1.85;color:var(--text);white-space:pre-wrap;word-break:break-word}
.wrong-seal{width:20px;height:20px;border:1.6px solid var(--accent);border-radius:5px;color:var(--accent);font-family:var(--serif);font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex:none}
/* ============ 设置 ============ */
.theme-row{display:flex;gap:16px;flex-wrap:wrap;padding:6px 2px}
.theme-btn{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;background:none;border:none;padding:0}
.theme-btn .dot{width:46px;height:46px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-btn .dot i{width:30px;height:30px;border-radius:50%;display:block}
.theme-btn .nm{font-size:12px;color:var(--sub);transition:color .2s}
.theme-btn.active .dot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-btn.active .nm{color:var(--accent);font-weight:600}
.auto-dark-row{display:flex;align-items:center;gap:12px}
.switch input{display:none}
.dk-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px dashed var(--line);margin-top:14px}
.dk-t{display:flex;flex-direction:column;gap:2px}
.data-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 2px;border-bottom:1px dashed var(--line)}
.data-row:last-of-type{border-bottom:none}
.data-t{display:flex;flex-direction:column;gap:3px}
.about-row{display:flex;align-items:center;gap:14px}
.time-field{display:flex;align-items:center;gap:8px}
.time-field input[type=time]{border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;background:var(--card);color:var(--text);outline:none}
.time-field input[type=time]:focus{border-color:var(--accent)}
.data-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.about-seal{width:70px;height:70px;border-radius:20px;font-size:38px;margin:0 auto 14px;border-width:2.6px}
.about-wrap{text-align:center;padding:18px 10px}
.about-name{font-family:var(--serif);font-size:24px;font-weight:900;letter-spacing:.2em}
.about-tag{font-size:12px;color:var(--sub);letter-spacing:.22em;margin-top:6px}
/* ============ 弹窗与提示 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(22,20,17,.48);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal-mask[hidden]{display:none}
.modal{width:100%;max-width:540px;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:24px;animation:slideUp .28s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal h3{font-size:18px;margin-bottom:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.confirm-icon{width:54px;height:54px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.confirm-icon svg{width:26px;height:26px}
.toast-wrap{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);max-width:88vw;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1;animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.pull-hint{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:12px;color:var(--faint);transform:translateY(-100%);transition:transform .2s;z-index:90;background:var(--bg);pointer-events:none}
.pull-hint.show{transform:translateY(0)}
.flash{animation:flashBg 1.4s ease}
@keyframes flashBg{0%{box-shadow:0 0 0 3px var(--accent-soft)}100%{box-shadow:var(--shadow)}}
/* ============ 响应式：平板双栏 ============ */
@media (min-width:769px) and (max-width:1024px){
  .shell{grid-template-columns:78px 1fr}
  .sidebar{padding:18px 10px;align-items:center}
  .brand{flex-direction:column;gap:8px;padding:2px 0 16px}
  .brand-name,.brand-sub{display:none}
  .nav{width:100%}
  .nav-item{justify-content:center;padding:12px 0}
  .nav-item .nav-label{display:none}
  .side-foot{display:none}
  .main{padding:22px 24px 80px}
}
/* ============ 响应式：手机底部Tab ============ */
@media (max-width:768px){
  .shell{display:block}
  .sidebar{display:none}
  .main{padding:14px 14px 110px}
  .topbar{margin-bottom:16px}
  .brand-mini,.brand-mini-name{display:flex}
  .topbar-title{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:80;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;color:var(--faint);font-size:10.5px;transition:color .2s;border-radius:12px}
  .tab-item svg{width:22px;height:22px}
  .tab-item.active{color:var(--accent);font-weight:600}
  .view-title{font-size:22px}
  .pnl-amount{font-size:28px}
  .timer-grid{grid-template-columns:1fr}
  .timer-display{font-size:44px}
  .chart-grid{grid-template-columns:1fr}
  .chart-box .chart{min-height:280px}
  .form-row{grid-template-columns:1fr}
  .modal{border-radius:18px 18px 0 0;padding:20px}
  .hold-item{flex-wrap:wrap;gap:10px 14px}
  .hold-main{flex:1;min-width:0;max-width:none}
  .hold-pnl-col{flex:1;min-width:64px}
  .hold-clear{width:100%}
}
@media (min-width:1025px){
  .modal-mask{align-items:center}
  .modal{border-radius:20px}
}
/* ============ 下拉刷新指示器 ============ */
#gudaoPullHint{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 15px;font-size:12.5px;color:var(--sub);box-shadow:var(--shadow);z-index:95;opacity:0;pointer-events:none;transition:opacity .16s ease;font-variant-numeric:tabular-nums}
#gudaoPullHint svg{color:var(--accent);flex:none}
#gudaoPullHint.spin svg{animation:pullSpin .8s linear infinite}
@keyframes pullSpin{to{transform:rotate(360deg)}}
/* ============ 启动动画 ============ */
#splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
.splash-logo{width:86px;height:86px;display:flex;align-items:center;justify-content:center;animation:splashLogo 1.05s cubic-bezier(.22,1,.36,1);filter:drop-shadow(0 10px 26px rgba(193,39,45,.22))}
.splash-logo img{width:86px;height:86px;border-radius:22px;display:block}
.splash-name{font-family:var(--serif);font-size:32px;font-weight:700;color:var(--text);letter-spacing:.42em;margin-left:.42em;animation:splashName .9s ease}
.splash-sub{font-size:12px;color:var(--faint);letter-spacing:.5em;margin-left:.5em;animation:splashSub 1.1s ease}
@keyframes splashLogo{0%{transform:scale(.68) rotate(-16deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes splashName{0%{opacity:0;letter-spacing:.8em}100%{opacity:1;letter-spacing:.42em}}
@keyframes splashSub{0%,55%{opacity:0}100%{opacity:1}}
</style>

function jsonp(url, cbParam, timeout){
  return new Promise((resolve, reject) => {
    const name = '__gudao_cb_' + (jsonp.n = (jsonp.n||0) + 1);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, timeout || 12000);
    function cleanup(){
      clearTimeout(timer);
      try{ delete window[name]; }catch(e){ window[name] = undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
    }
    window[name] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('network')); };
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + cbParam + '=' + name;
    document.head.appendChild(s);
  });
}

/* ============ 盈亏计算 ============ */
function acctCalc(){
  const a = store.account;
  const marketValue = store.holdings.reduce((s,x) => s + x.shares * x.currentPrice, 0);
  const cost = store.holdings.reduce((s,x) => s + x.shares * x.costPrice, 0);
  const floatPnl = marketValue - cost;
  const realized = store.closedTrades.reduce((s,t) => s + t.pnl, 0);
  const totalPnl = floatPnl + realized;
  const investedCost = cost + store.closedTrades.reduce((s,t) => s + t.costPrice * t.shares, 0);
  const totalPnlPct = investedCost > 0 ? totalPnl / investedCost : null;
  const totalAssets = a ? a.totalAssets : null;
  const available = (totalAssets != null) ? totalAssets - marketValue : null;
  return {marketValue, cost, floatPnl, realized, totalPnl, totalPnlPct, totalAssets, available};
}
function dayPnlOf(date){
  const realized = store.closedTrades.filter(t => t.date === date).reduce((s,t) => s + t.pnl, 0);
  const manual = (store.dailyPnl[date] && store.dailyPnl[date].manual) || 0;
  return realized + manual;
}
function monthPnl(y, m){
  let s = 0;
  const pre = y + '-' + pad(m) + '-';
  store.closedTrades.forEach(t => { if(t.date.indexOf(pre) === 0) s += t.pnl; });
  Object.keys(store.dailyPnl).forEach(ds => { if(ds.indexOf(pre) === 0) s += store.dailyPnl[ds].manual || 0; });
  return s;
}
function yearPnl(y){
  let s = 0;
  const pre = String(y) + '-';
  store.closedTrades.forEach(t => { if(t.date.indexOf(pre) === 0) s += t.pnl; });
  Object.keys(store.dailyPnl).forEach(ds => { if(ds.indexOf(pre) === 0) s += store.dailyPnl[ds].manual || 0; });
  return s;
}
function winStats(){
  const trades = store.closedTrades;
  if(!trades.length) return {count:0, winRate:null, ratio:null};
  const wins = trades.filter(t => t.pnl > 0);
  const losses = trades.filter(t => t.pnl < 0);
  const avgWin = wins.length ? wins.reduce((s,t)=>s+t.pnl,0) / wins.length : 0;
  const avgLoss = losses.length ? Math.abs(losses.reduce((s,t)=>s+t.pnl,0)) / losses.length : 0;
  const winRate = wins.length / trades.length;
  const ratio = avgLoss > 0 ? avgWin / avgLoss : (avgWin > 0 ? null : null);
  return {count: trades.length, winRate, ratio};
}

        '<div class="stat-card" data-k="float"><div class="k">浮动盈亏</div><div class="v ' + (c.floatPnl>=0?'up':'down') + '">' + fmtMoney(c.floatPnl) + '</div></div>' +
        '<div class="stat-card" data-k="day"><div class="k">当日盈亏</div><div class="v ' + cls + '">' + fmtMoney(dayPnl) + '</div></div>' +
        '<div class="stat-card" data-k="mv"><div class="k">总市值</div><div class="v">' + fmtMoney(c.marketValue) + '</div></div>' +
        '<div class="stat-card" data-k="avail"><div class="k">可用</div><div class="v mid">' + fmtMoney(c.available) + '</div></div>' +
        '<div class="stat-card" data-k="withdraw"><div class="k">可取</div><div class="v">' + fmtMoney(withdrawable) + '</div></div>' +
      '</div>' +
      '<div class="hint" style="margin-top:12px">可用 = 总资产 − 持仓市值（可用来买入）；可取 = 可用资金次日方可取出（A股 T+1），今日转入 ' + fmtMoney(todayIn) + ' 次日可取。</div></div>';
  }
  const aiOn = !!(store.ai && store.ai.enabled && store.ai.key);
  const qa = store.quoteAI = store.quoteAI || {date:'', text:''};
  const qFresh = qa.date === todayStr() && qa.text;
  const quoteHtml = '<div class="card quote-card"><div class="quote-mark">' + taijiSvg() + '</div>' +
    '<div style="flex:1;min-width:0"><div class="quote-text" id="quoteText">「' + esc(qFresh ? qa.text : (aiOn ? '…' : todayDaily())) + '」</div>' +
    '<div class="quote-cap" id="quoteCap">' + (qFresh ? 'AI 交易心法 · 每日自动生成' : (aiOn ? 'AI 心法生成中…' : '内置语录 · 开启 AI 后每日自动生成心法')) + '</div></div>' +
    '<button class="icon-btn" id="nextQuote" title="换一句" aria-label="换一句">' + icon('refresh', 16) + '</button></div>';

  let enterHtml;
  if(store.enterDate){
    const days = Math.max(1, Math.floor((new Date(todayStr() + 'T00:00:00') - new Date(store.enterDate + 'T00:00:00')) / 864e5) + 1);
    enterHtml = '<div class="card enter-card"><div class="enter-seal">市</div>' +
      '<div style="flex:1;min-width:0"><div class="enter-name">入市时间 · ' + esc(store.enterDate) + '</div>' +
      '<div class="enter-days">已入市 <b>' + days + '</b> 天</div></div>' +
      '<button class="btn btn-sm btn-ghost" id="setEnter">修改</button></div>';
  } else {
    enterHtml = '<div class="card enter-card"><div class="enter-seal">市</div>' +
      '<div style="flex:1;min-width:0"><div class="enter-name">入市时间</div>' +
      '<div class="enter-days" style="color:var(--faint);font-size:12px">记录入市日期，见证交易成长</div></div>' +
      '<button class="btn btn-sm btn-primary" id="setEnter">设置日期</button></div>';
  }

  const indexCard = '<div class="card"><div class="card-head"><div class="card-title">大盘走势</div>' +
    '<button class="icon-btn" id="idxRefresh" title="刷新" aria-label="刷新">' + icon('refresh', 16) + '</button></div>' +
    '<div id="idxList"><div class="hint" style="padding:8px 0">加载中…</div></div></div>';

  let holdHtml = '';
  if(store.holdings.length){
    holdHtml = store.holdings.map(h => {
      const pnl = (h.currentPrice - h.costPrice) * h.shares;
      const pnlPct = h.costPrice ? (h.currentPrice - h.costPrice)/h.costPrice : 0;
      const cls = pnl >= 0 ? 'up' : 'down';
      return '<div class="hold-item" data-sid="' + esc(h.symbol) + '" data-id="' + h.id + '" title="点击查看 K 线 / 分时">' +
        '<div class="hold-main"><div class="hold-name ' + cls + '" title="点击查看 K 线 / 分时">' + esc(h.name) + '</div>' +
        '<div class="hold-mv ' + cls + '">' + fmtMoney(h.shares * h.currentPrice) + '</div></div>' +
        '<div class="hold-pnl-col ' + cls + '">' +
          '<div class="hold-pnl-amt">' + fmtPnl(pnl) + '</div>' +
          '<div class="hold-pnl-pct">' + fmtPct(pnlPct) + '</div>' +
        '</div>' +
        '<div class="hold-qty"><div class="k">股数</div><div class="v">' + h.shares + '</div></div>' +
        '<div class="hold-price"><div class="k">成本</div><div class="v">' + h.costPrice + '</div>' +
          '<div class="k">现价</div><div class="v">' + h.currentPrice + '</div></div>' +
        '<button class="btn btn-sm btn-ghost hold-clear" data-hold="' + h.id + '">清仓</button>' +
      '</div>';
    }).join('');
  } else {
    holdHtml = '<div class="empty" style="padding:20px"><p>暂无持仓。搜索股票、录入成本价即可建仓。</p>' +
      '<button class="btn btn-sm btn-primary" id="openHold">搜索建仓</button></div>';
  }
  const holdCard = '<div class="card"><div class="card-head"><div class="card-title">我的持仓 <span class="tag tag-accent">' + store.holdings.length + '</span></div>' +
    (store.holdings.length ? '<button class="btn btn-sm btn-primary" id="openHold">建仓</button>' : '') + '</div>' + holdHtml + '</div>';

  el.innerHTML =
    '<div class="view-head"><h1 class="view-title">总览</h1><p class="view-sub">账户盈亏、持仓与每日心法，一目了然</p></div>' +
    enterHtml + accountHtml + quoteHtml + holdCard + indexCard;

  bindEl('goAcct', () => { ui.reviewFocus = 'account'; nav('settings'); });
  bindEl('editAcct', () => { ui.reviewFocus = 'account'; nav('settings'); });
  bindEl('nextQuote', () => {
    if(aiOn){ aiGenQuote(true); return; }
    store.quoteOffset = (store.quoteOffset||0) + 1; save(); renderHome();
  });
  bindEl('setEnter', () => enterModal());
  bindEl('openHold', () => buildModal());
  bindEl('idxRefresh', () => loadIndexCard(true));
  if(aiOn && !qFresh) aiGenQuote(false);
  $$('#home-el [data-hold]').forEach(b => b.addEventListener('click', () => holdModal(b.dataset.hold)));
  $$('#home-el .hold-item').forEach(row => row.addEventListener('click', e => {
    if(e.target.closest('.hold-clear')) return;
    const h = store.holdings.find(x => x.id === row.dataset.id);
    if(h) klineModal(secidToTx(h.symbol), h.name);
  }));
  loadIndexCard();
}

/* ============ 建仓 / 持仓管理 ============ */
function buildModal(){
  let selected = null;
  const renderResults = q => {
    const kw = q.trim().toLowerCase().replace(/^(sh|sz|bj)\s*/i, '');
    const list = kw ? STOCKS.filter(s => s.c.includes(kw) || s.n.toLowerCase().includes(kw) || s.p.includes(kw) || s.a.includes(kw)).slice(0, 30)
                    : STOCKS.slice(0, 8);
    $('#stkResults').innerHTML = list.length ? list.map(s =>
      '<div class="stk-item' + (selected && selected.c === s.c ? ' on' : '') + '" data-c="' + s.c + '">' +
      '<span class="stk-n">' + s.n + '</span><span class="stk-m">' + s.c + ' · ' + s.s + '</span></div>').join('')
      : '<div class="empty" style="padding:16px"><p>未找到匹配的标的，试试代码 / 名称 / 拼音</p></div>';
    $$('#stkResults .stk-item').forEach(it => it.addEventListener('click', () => {
      selected = STOCKS.find(s => s.c === it.dataset.c);
      const selHtml = selected
        ? '<div class="stk-sel"><span class="nm">' + selected.n + '</span><span class="stk-m">' + selected.c + ' · ' + selected.s + '</span></div>'
        : '';
      $('#stkSel').innerHTML = selHtml;
      renderResults($('#stkQ').value);
    }));
  };
  openModal(
    '<h3>建仓 · 添加持仓</h3>' +
    '<div class="form-item"><label class="form-label">搜索股票（代码 / 名称 / 拼音）</label>' +
    '<input class="field" id="stkQ" placeholder="如 600519 / 茅台 / gzmt" autocomplete="off">' +
    '<div class="stk-results" id="stkResults"></div></div>' +
    '<div id="stkSel"></div>' +
    '<div class="form-row">' +
      '<div class="form-item"><label class="form-label">成本价</label><input class="field" type="number" inputmode="decimal" id="btCost" placeholder="买入价"></div>' +
      '<div class="form-item"><label class="form-label">股数</label><input class="field" type="number" inputmode="numeric" id="btShares" placeholder="如 100"></div>' +
    '</div>' +
    '<div class="hint" id="btMax" style="margin-top:8px">输入成本价后，将按可用资金估算最大可买股数。</div>' +
    '<div class="form-item"><label class="form-label">建仓日期</label><input class="field" type="date" id="btDate" value="' + todayStr() + '"></div>' +
    '<div class="modal-foot"><button class="btn" data-x>取消</button><button class="btn btn-primary" id="btSave">确认建仓</button></div>'
  );
  $('#stkQ').addEventListener('input', () => renderResults($('#stkQ').value));
  renderResults('');
  const calcMaxShares = () => {
    const el = $('#btMax');
    if(!el) return;
    const costP = num($('#btCost').value);
    const c = acctCalc();
    if(c.available == null){ el.textContent = '尚未录入总资产，无法估算可买股数（请先在账户设置录入总资产）'; el.style.color = ''; return; }
    if(costP == null || costP <= 0){ el.textContent = '输入成本价后，将按可用资金估算最大可买股数。'; el.style.color = ''; return; }
    const max = Math.max(0, Math.floor(c.available / costP / 100) * 100);
    el.textContent = '可用资金 ' + fmtMoney(c.available) + '，按 ' + costP + ' 元/股可买最多 ' + max + ' 股（约 ' + fmtMoney(max * costP) + '）';
    el.style.color = max > 0 ? 'var(--sub)' : 'var(--faint)';
  };
  $('#btCost').addEventListener('input', calcMaxShares);
  $('#btShares').addEventListener('input', calcMaxShares);
  $('#btSave').addEventListener('click', () => {
    if(!selected){ toast('请先选择股票'); return; }
    const costP = num($('#btCost').value), shares = num($('#btShares').value);
    if(costP == null || costP <= 0){ toast('请输入有效的成本价'); return; }
    if(shares == null || shares <= 0 || !Number.isInteger(shares)){ toast('请输入有效的股数（整数）'); return; }
    const c = acctCalc();
    if(c.available != null && costP * shares > c.available + 1e-6){
      toast('可用资金不足：买入需 ' + fmtMoney(costP * shares) + '，可用仅 ' + fmtMoney(c.available));
      return;
    }
    if(!store.account) store.account = {totalAssets: null};
    const exist = store.holdings.find(h => h.symbol === selected.c);
    if(exist){
      const newCost = (exist.costPrice*exist.shares + costP*shares) / (exist.shares + shares);
      exist.shares += shares;
      exist.costPrice = Math.round(newCost*1000)/1000;
    } else {
      store.holdings.push({id:uid(), symbol:selected.c, name:selected.n, shares, costPrice:costP, currentPrice:costP, openDate:$('#btDate').value || todayStr()});
    }
    save(); closeModal(); renderHome(); toast('已建仓 ' + selected.n + ' ' + shares + ' 股');
  });
}
function holdModal(id){
  const h = store.holdings.find(x => x.id === id);
  if(!h) return;
  const pnl = (h.currentPrice - h.costPrice) * h.shares;
  openModal(
    '<h3>' + esc(h.name) + ' <span style="font-size:13px;color:var(--faint)">' + esc(h.symbol) + '</span></h3>' +
    '<div class="stat-grid" style="margin:6px 0 14px">' +
      '<div class="stat-card"><div class="k">股数</div><div class="v mid">' + h.shares + '</div></div>' +
      '<div class="stat-card"><div class="k">成本价</div><div class="v mid">' + h.costPrice + '</div></div>' +
      '<div class="stat-card"><div class="k">现价</div><div class="v mid">' + h.currentPrice + '</div></div>' +
      '<div class="stat-card"><div class="k">浮动盈亏</div><div class="v mid ' + (pnl>=0?'up':'down') + '">' + fmtPnl(pnl) + '</div></div>' +
    '</div>' +
    '<div class="form-item"><label class="form-label">更新现价（按最新行情）</label>' +
    '<div class="form-row" style="grid-template-columns:1fr auto;align-items:end">' +
      '<input class="field" type="number" inputmode="decimal" id="hlPrice" value="' + h.currentPrice + '">' +
      '<button class="btn" id="hlUpdate">更新</button></div></div>' +
    '<div class="form-row">' +
      '<div class="form-item"><label class="form-label">清仓卖出价</label><input class="field" type="number" inputmode="decimal" id="hlSellPrice" value="' + h.currentPrice + '"></div>' +
      '<div class="form-item"><label class="form-label">卖出股数</label><input class="field" type="number" inputmode="numeric" id="hlSellShares" value="' + h.shares + '"></div>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn" data-x>关闭</button><button class="btn btn-danger" id="hlSell">确认清仓</button></div>'
  );
  bindEl('hlUpdate', () => {
    const p = num($('#hlPrice').value);
    if(p == null || p <= 0){ toast('请输入有效的现价'); return; }
    h.currentPrice = p; save(); closeModal(); renderHome(); toast('现价已更新');
  });
  bindEl('hlSell', () => {
    const sp = num($('#hlSellPrice').value);
    const sh = Math.floor(num($('#hlSellShares').value) || 0);
    if(sp == null || sp <= 0){ toast('请输入有效的卖出价'); return; }
    if(sh <= 0 || sh > h.shares){ toast('卖出股数需在 1 ~ ' + h.shares + ' 之间'); return; }
    const pnl = (sp - h.costPrice) * sh;
    store.closedTrades.push({id:uid(), symbol:h.symbol, name:h.name, shares:sh, costPrice:h.costPrice, sellPrice:sp, pnl:Math.round(pnl*100)/100, date:todayStr()});
    h.shares -= sh;
    h.currentPrice = sp;
    if(h.shares <= 0) store.holdings = store.holdings.filter(x => x.id !== h.id);
    save(); closeModal(); renderHome(); toast('已清仓 ' + sh + ' 股，盈亏 ' + fmtMoney(pnl));
  });
}

/* ============ K线图表 ============ */
const INDEX_SECID = {'000001':'1.000001', '399001':'0.399001', '399006':'0.399006'};
let klChart = null;
let klTimer = null;
function stopKlTimer(){ if(klTimer){ clearInterval(klTimer); klTimer = null; } }
function klineModal(txCode, name, isIndex){
  const code = String(txCode).slice(2);
  openModal(
    '<h3>' + esc(name) + ' <span class="stk-m">' + code + (isIndex ? ' · 指数' : '') + '</span></h3>' +
    '<div class="seg" id="klSeg" style="margin:2px 0 10px">' +
      [['day','日K'],['week','周K'],['month','月K'],['min','分时']].map((kv,i) => '<button type="button" class="' + (i===0?'on':'') + '" data-k="' + kv[0] + '">' + kv[1] + '</button>').join('') +
    '</div>' +
    '<div class="kline-info" id="klInfo"><span class="hint">加载中…</span></div>' +
    '<div id="klChart" style="height:330px;width:100%"></div>' +
    '<div class="modal-foot" style="margin-top:8px"><button class="btn" data-x>关闭</button></div>'
  );
  let cur = 'day';
  const snapSecid = isIndex ? (INDEX_SECID[code] || '1.' + code) : codeToEastSecid(code);
  const marks = isIndex ? [] : klineMarkPoints(code, name);
  const load = () => {
    stopKlTimer();
    const el = document.getElementById('klChart');
    const incremental = (cur === 'min' && klChart && klChart.__mode === 'min');
    if(!incremental && klChart){ try{ klChart.dispose(); }catch(e){} klChart = null; }
    if(!incremental) $('#klInfo').innerHTML = '<span class="hint">加载中…</span>';
    if(cur === 'min'){
      Promise.all([fetchMinute(txCode).catch(() => null), fetchQuoteSnap(snapSecid).catch(() => null)])
        .then(([mn, snap]) => {
          if(!mn){
            $('#klInfo').innerHTML = '<span class="hint">分时数据加载失败，请检查网络后重试</span>';
            return;
          }
          const prevClose = (snap && snap.prevClose > 0) ? snap.prevClose : 0;
          const last = mn.rows[mn.rows.length - 1].price;
          const pct = prevClose ? (last - prevClose)/prevClose*100 : 0;
          const cls = last >= prevClose ? 'up' : 'down';
          $('#klInfo').innerHTML =
            '<span>最新 <b class="' + cls + '">' + last.toFixed(2) + '</b></span>' +
            '<span class="' + cls + '">' + (last - prevClose).toFixed(2) + (pct ? '（' + pct.toFixed(2) + '%）' : '') + '</span>' +
            (mn.date ? '<span>' + mn.date + '</span>' : '') +
            (prevClose ? '<span>昨收 ' + prevClose.toFixed(2) + '</span>' : '');
          if(window.echarts){ renderMinute(el, name, mn.rows, prevClose, !isIndex, incremental); }
          else { el.innerHTML = '<div class="hint" style="padding:12px">图表组件加载中，请稍候…</div>'; loadECharts().then(() => load()).catch(() => { el.innerHTML = '<div class="hint" style="padding:12px">图表组件加载失败，请检查网络</div>'; }); }
          if(isTradingTime()){
            klTimer = setInterval(() => {
              if(!document.getElementById('klChart')){ stopKlTimer(); return; }
              load();
            }, 30000);
          }
        });
      return;
    }
    Promise.all([
      fetchKline(txCode, cur, cur === 'month' ? 90 : 130).catch(() => null),
      fetchQuoteSnap(snapSecid).catch(() => null)
    ]).then(([kl, snap]) => {
      if(!kl || !kl.length){
        $('#klInfo').innerHTML = '<span class="hint">K线数据加载失败，请检查网络后重试</span>';
        return;
      }
      const last = kl[kl.length - 1];
      const prev = kl.length > 1 ? kl[kl.length - 2] : last;
      let info = {price:last.close, prevClose:prev.close, open:last.open, high:last.high, low:last.low, pct: last.close && prev.close ? (last.close-prev.close)/prev.close*100 : 0};
      if(snap && snap.price > 0){
        info = {price:snap.price, prevClose:snap.prevClose || prev.close, open:snap.open, high:snap.high, low:snap.low, pct:snap.pct};
      }
      const amt = info.price - info.prevClose;
      const cls = amt >= 0 ? 'up' : 'down';
      $('#klInfo').innerHTML =
        '<span>最新 <b class="' + cls + '">' + info.price.toFixed(2) + '</b></span>' +
        '<span class="' + cls + '">' + amt.toFixed(2) + '（' + info.pct.toFixed(2) + '%）</span>' +
        '<span>今开 ' + info.open.toFixed(2) + '</span>' +
        '<span>最高 ' + info.high.toFixed(2) + '</span>' +
        '<span>最低 ' + info.low.toFixed(2) + '</span>' +
        (marks.length ? '<span class="hint">图钉 · B 建仓 / S 清仓 / T 交易笔记</span>' : '');
      if(window.echarts){
        const css = getComputedStyle(document.documentElement);
        const sub = (css.getPropertyValue('--sub') || '#999').trim();
        const line = (css.getPropertyValue('--line') || '#eee').trim();
        const dates = kl.map(k => k.date);
        const dateIdx = {};
        dates.forEach((d,i) => dateIdx[d] = i);
        const candles = kl.map(k => [k.open, k.close, k.low, k.high]);
        const vols = kl.map(k => ({value:k.vol, itemStyle:{color: k.close >= k.open ? 'rgba(193,39,45,.7)' : 'rgba(46,158,91,.7)'}}));
        const ma = n => { const r = []; let s = 0; kl.forEach((k,i)=>{ s += k.close; if(i>=n) s -= kl[i-n].close; r.push(i>=n-1 ? +(s/n).toFixed(2) : '-'); }); return r; };
        const markData = marks.filter(p => dateIdx[p.date] != null).map(p => ({
          name:p.tag, coord:[dateIdx[p.date], p.price > 0 ? p.price : kl[dateIdx[p.date]].high], value:p.tag,
          itemStyle:{color: p.tag === 'B' ? '#C1272D' : p.tag === 'S' ? '#2E9E5B' : '#E6A23C'}
        }));
        klChart = echarts.init(el);
        klChart.setOption({
          animation:false,
          backgroundColor:'transparent',
          tooltip:{trigger:'axis', axisPointer:{type:'cross'}},
          axisPointer:{link:[{xAxisIndex:'all'}], label:{backgroundColor:'#C1272D'}},
          grid:[{left:6, right:6, top:22, height:'55%'}, {left:6, right:6, top:'72%', height:'16%'}],
          xAxis:[
            {type:'category', data:dates, boundaryGap:true, axisLine:{lineStyle:{color:line}}, axisLabel:{color:sub, fontSize:10}, axisTick:{show:false}},
            {type:'category', gridIndex:1, data:dates, boundaryGap:true, axisLine:{lineStyle:{color:line}}, axisLabel:{show:false}, axisTick:{show:false}, splitLine:{show:false}}
          ],
          yAxis:[
            {scale:true, position:'right', axisLabel:{color:sub, fontSize:10}, splitLine:{lineStyle:{color:line, type:'dashed'}}},
            {gridIndex:1, scale:true, splitNumber:2, axisLabel:{color:sub, fontSize:9, formatter:v => v >= 10000 ? (v/10000) + '万' : v}, splitLine:{show:false}}
          ],
          dataZoom:[
            {type:'inside', xAxisIndex:[0,1], start:35, end:100},
            {type:'slider', xAxisIndex:[0,1], bottom:0, height:15, brushSelect:false}
          ],
          series:[
            {name:name, type:'candlestick', data:candles,
              markPoint:{symbol:'pin', symbolSize:32, label:{fontSize:11, fontWeight:700, color:'#fff'}, data:markData},

function fetchJSON(u, timeout){
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), timeout || 15000) : null;
  return fetch(u, ctrl ? {signal: ctrl.signal} : undefined).then(r => {
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).finally(() => { if(timer) clearTimeout(timer); });
}
function fetchRetry(u, n, timeout){
  let i = 0;
  const go = () => fetchJSON(u, timeout).catch(() => { i++; if(i < n) return go(); throw new Error('fetch failed'); });
  return go();
}

function fmtReviewText(t){

    if(/^(\d{2}\.\d{2}|\d{4}-\d{2}-\d{2}|次日（|今日龙虎榜)/.test(s) && s.length < 45 && !/^-/.test(s))
      return '<div class="fmt-title">' + esc(s) + '</div>';
    if(/^[一二三四五六七八九十]+、/.test(s))
      return '<div class="fmt-sec">' + esc(s) + '</div>';
    if(/^(①|②|③|④|⑤|\d+\.)/.test(s))
      return '<div class="fmt-item">' + esc(s) + '</div>';
    if(/^-/.test(s))

}

const rvBusy = {};
function updateReviewAI(key){
  if(rvBusy[key]) return;
  rvBusy[key] = true;
  const ra = store.reviewAI = store.reviewAI || {daily:null, plan:null, news:null, lhb:null};
  const dash = todayStr(), ymd = dash.replace(/-/g, '');
  toast('正在拉取数据生成，请稍候…');
  const release = () => { rvBusy[key] = false; };
  const useAI = !!(store.ai && store.ai.enabled && store.ai.key);
  const done = (content, src, extra) => {
    const o = {date: dash, content: content, updatedAt: Date.now(), src: src || 'rule'};
    if(extra) Object.assign(o, extra);
    ra[key] = o;
    if(key === 'lhb'){
      ra.lhbHist = ra.lhbHist || {};
      ra.lhbHist[dash] = {date: dash, content: content, updatedAt: o.updatedAt, src: o.src};
      ui.lhbDate = dash;
    } else {
      ra.hist = ra.hist || {};
      ra.hist[key] = ra.hist[key] || {};
      ra.hist[key][dash] = {date: dash, content: content, updatedAt: o.updatedAt, src: o.src};
      ui.rvDate = ui.rvDate || {};
      ui.rvDate[key] = dash;
    }
    save(); renderReview(); release(); toast('已更新');
  };
  const aiOr = (data, rule) => {
    if(!useAI) return rule();
    aiReview(key, data).then(txt => {
      if(txt && txt.trim()) done(txt.trim(), 'ai');
      else if(store.ai.fallback !== false) rule();
      else { release(); toast('AI 返回为空'); }
    }).catch(err => {
      if(store.ai.fallback !== false){ rule(); toast('AI 调用失败，已回退规则模板（' + err.message.slice(0, 40) + '）'); }
      else { release(); toast('AI 调用失败：' + err.message.slice(0, 60)); }
    });
  };
  if(key === 'daily' || key === 'plan'){
    Promise.all([fetchZTPool(ymd).catch(() => null), fetchDTPool(ymd).catch(() => null), fetchIndexSnap().catch(() => [])])
      .then(([zt, dt, mkt]) => {
        if(!zt && !dt){ release(); toast('涨停/跌停数据拉取失败，请重试'); return; }
        aiOr({zt: zt, dt: dt, mkt: mkt}, () => done(key === 'daily' ? genDailyReview(zt, dt, mkt) : genPlan(zt, dt), 'rule'));
      }).catch(() => { release(); toast('复盘数据拉取失败'); });
  } else if(key === 'lhb'){
    fetchLHB(dash).then(list => {
      aiOr({lhb: list}, () => done(genLHB(list), 'rule'));
    }).catch(() => { release(); toast('龙虎榜数据拉取失败'); });
  } else if(key === 'news'){
    fetchKuaixun().then(kx => {
      const raw = kxToRaw(kx);
      aiOr({kx: kx}, () => done(genNews(kx), 'rule', {raw: raw}));
    }).catch(() => { release(); toast('消息面数据拉取失败（已尝试东方财富 / 新浪滚动 / 新浪直播三个数据源）'); });
  }
}
function reviewAutoCheck(){
  const ra = store.reviewAI = store.reviewAI || {daily:null, plan:null, news:null, lhb:null};
  const now = new Date();
  const hm = now.getHours() * 60 + now.getMinutes();
  const dash = todayStr();
  const trading = now.getDay() !== 0 && now.getDay() !== 6;
  if(hm >= 1020 && trading){
    if(!ra.daily || ra.daily.date !== dash){ updateReviewAI('daily'); return; }
    if(!ra.plan || ra.plan.date !== dash){ updateReviewAI('plan'); return; }
    if(!ra.lhb || ra.lhb.date !== dash){ updateReviewAI('lhb'); return; }
  }
  if(hm >= 1260){
    if(!ra.news || ra.news.date !== dash) updateReviewAI('news');
  }
}

function analysisDayCal(){
  const now = new Date();
  if(!ui.analysisCal) ui.analysisCal = {y: now.getFullYear(), m: now.getMonth()};
  const y = ui.analysisCal.y, m = ui.analysisCal.m;
  const first = new Date(y, m, 1);
  const lead = (first.getDay()+6)%7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  let cells = '';
  for(let i=lead-1;i>=0;i--){
    const d = prevDays - i;
    const ds = fmtDate(new Date(y, m-1, d));
    cells += '<div class="cal-day other" data-d="' + ds + '">' + d + '<span class="pnl-cell ' + pnlCls(dayPnlOf(ds)) + '">' + fmtPnlSmall(dayPnlOf(ds)) + '</span></div>';
  }
  for(let d=1; d<=daysInMonth; d++){
    const ds = fmtDate(new Date(y, m, d));
    const isToday = ds === todayStr();
    const sel = ui.selDay === ds;
    cells += '<div class="cal-day' + (isToday?' today':'') + (sel?' sel':'') + '" data-d="' + ds + '">' + d +
      '<span class="pnl-cell ' + pnlCls(dayPnlOf(ds)) + '">' + fmtPnlSmall(dayPnlOf(ds)) + '</span></div>';
  }
  const lastDow = (new Date(y, m, daysInMonth).getDay()+6)%7;
  for(let i=1; i<7-lastDow; i++){
    const ds = fmtDate(new Date(y, m+1, i));
    cells += '<div class="cal-day other" data-d="' + ds + '">' + i + '<span class="pnl-cell ' + pnlCls(dayPnlOf(ds)) + '">' + fmtPnlSmall(dayPnlOf(ds)) + '</span></div>';
  }
  return '<div class="card"><div class="card-head">' +
    '<button class="icon-btn" id="anaPrev" aria-label="上月">' + icon('back',16) + '</button>' +
    '<div class="card-title" style="font-size:16px">' + y + ' 年 ' + (m+1) + ' 月 · 每日盈亏</div>' +
    '<button class="icon-btn" id="anaNext" aria-label="下月">' + icon('forward',16) + '</button></div>' +
    '<div class="cal-grid7">' + ['一','二','三','四','五','六','日'].map(d => '<div class="cal-dow">' + d + '</div>').join('') + cells + '</div>' +
    '<div class="hint" style="margin-top:10px">红涨绿跌；点击任意日期查看明细或手动补录盈亏</div></div>';
}
function analysisMonthCal(y){
  let cells = '';

/* ============ 计时器逻辑 ============ */
const timers = {
  focus: {running:false, phase:'work', remain:0, total:0, iv:null}
};
function syncTimerUI(){
  const f = timers.focus;
  const ef = $('#dispfocus');
  if(ef){
    if(!f.running && f.remain === 0){ f.total = store.pomodoro.work*60; f.remain = f.total; }
    ef.textContent = fmtDur(f.remain);
    $('#badgefocus').textContent = '复盘 · ' + (f.phase==='work' ? '专注中' : '休息中');
    $('#badgefocus').classList.toggle('rest', f.phase==='rest');
    $('#startfocus').disabled = f.running;
    $('#pausefocus').disabled = !f.running && (f.remain === f.total);
    $('#endfocus').disabled = !f.running && (f.remain === f.total);
    $('#pausefocus').textContent = f.running ? '暂停' : (f.remain < f.total ? '继续' : '暂停');
  }
}
function tickTimer(type){
  const f = timers.focus;
  f.remain = Math.max(0, f.remain - 1);
  const el = $('#dispfocus');
  if(el) el.textContent = fmtDur(f.remain);
  if(f.remain <= 0) focusPhaseDone();
}
function focusPhaseDone(){
  const f = timers.focus;
  if(f.phase === 'work'){
    store.timerLogs.push({id:uid(), type:'focus', date:todayStr(), secs:store.pomodoro.work*60, label:'番茄钟'});
    save(); toast('专注完成，休息一下');
    notify('复盘专注完成', '本轮专注 ' + store.pomodoro.work + ' 分钟，已记录');
    f.phase = 'rest'; f.remain = store.pomodoro.rest*60;
  } else {
    toast('休息结束，开始下一轮专注');
    f.phase = 'work'; f.remain = store.pomodoro.work*60;
  }
  syncTimerUI();
}
function bindTimer(){
  const f = timers.focus;
  const sf = $('#startfocus'), pf = $('#pausefocus'), ef = $('#endfocus');
  if(sf) sf.addEventListener('click', () => {
    if(f.running) return;
    if(f.remain <= 0){ f.total = store.pomodoro.work*60; f.remain = f.total; f.phase = 'work'; }
    f.running = true; f.iv = setInterval(() => tickTimer('focus'), 1000); syncTimerUI();
  });
  if(pf) pf.addEventListener('click', () => {
    if(f.running){ f.running = false; clearInterval(f.iv); }
    else if(f.remain < f.total){ f.running = true; f.iv = setInterval(() => tickTimer('focus'), 1000); }
    syncTimerUI();
  });
  if(ef) ef.addEventListener('click', () => {
    clearInterval(f.iv); f.running = false; f.phase = 'work'; f.total = store.pomodoro.work*60; f.remain = f.total;
    syncTimerUI();
  });
}

/* ============ 图表 ============ */
const charts = {};
let chartRO = null;
function themeColors(){
  const cs = getComputedStyle(document.documentElement);
  const g = v => cs.getPropertyValue(v).trim();
  return {accent:g('--accent'), up:g('--up'), down:g('--down'), sub:g('--sub'), line:g('--line'), text:g('--text'), faint:g('--faint') || g('--sub')};
}
function initChart(id, option){
  const el = document.getElementById(id);
  if(!el || typeof echarts === 'undefined') return;
  if(charts[id]){ charts[id].dispose(); delete charts[id]; }
  const c = echarts.init(el);
  charts[id] = c;
  c.setOption(option);
  if(!chartRO) chartRO = new ResizeObserver(() => { Object.values(charts).forEach(ch => ch && ch.resize()); });
  chartRO.observe(el);
}
function baseGrid(top){
  return {left:8, right:14, top:top||34, bottom:6, containLabel:true};
}
function baseAxis(tc){
  return {
    axisLine:{lineStyle:{color:tc.line}},
    axisTick:{show:false},
    axisLabel:{color:tc.sub, fontSize:11},
    splitLine:{lineStyle:{color:tc.line}}
  };
}
function initTimerCharts(){

    legend:{data:['复盘'], bottom:0, icon:'roundRect', itemWidth:10, itemHeight:10, textStyle:{color:tc.sub, fontSize:11}},
    grid:baseGrid(36),
    xAxis:Object.assign({type:'category', data:r14.map(d=>d.label)}, baseAxis(tc)),
    yAxis:Object.assign({type:'value', name:'分钟', nameTextStyle:{color:tc.sub}}, baseAxis(tc)),
    series:[
      {name:'复盘', type:'line', smooth:true, data:focusArr, symbol:'circle', symbolSize:5,
        lineStyle:{width:2, color:tc.accent}, itemStyle:{color:tc.accent}, areaStyle:{color:tc.accent, opacity:.10}}
    ]
  });
  let plabels = [], pdata = [];
  if(ui.period === 'week'){
    for(let i=5;i>=0;i--){
      const w = weekRange(i);
      const total = secsInRange('focus', w.from, w.to);
      plabels.push((w.start.getMonth()+1) + '/' + w.start.getDate());
      pdata.push(+(total/3600).toFixed(1));
    }
  } else {
    const now = new Date();
    for(let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const from = fmtDate(d);
      const last = new Date(now.getFullYear(), now.getMonth()-i+1, 0).getDate();
      const to = fmtDate(new Date(now.getFullYear(), now.getMonth()-i, last));
      const total = secsInRange('focus', from, to);
      plabels.push((d.getMonth()+1) + '月');
      pdata.push(+(total/3600).toFixed(1));
    }
  }
  initChart('chartPeriod', {
    tooltip:{trigger:'axis', confine:true, valueFormatter:v => v + ' 小时'},
    grid:baseGrid(34),
    xAxis:Object.assign({type:'category', data:plabels}, baseAxis(tc)),
    yAxis:Object.assign({type:'value', name:'小时', nameTextStyle:{color:tc.sub}}, baseAxis(tc)),
    series:[{type:'bar', data:pdata, barWidth:'48%', itemStyle:{color:tc.accent, borderRadius:[4,4,0,0]}}]
  });
  let rlabels = [], rdata = [];
  for(let i=5;i>=0;i--){
    const w = weekRange(i);
    rlabels.push((w.start.getMonth()+1) + '/' + w.start.getDate());
    const r = weekRate(w.start);
    rdata.push(r == null ? null : +(r*100).toFixed(0));
  }
  initChart('chartRate', {
    tooltip:{trigger:'axis', confine:true, valueFormatter:v => v == null ? '无任务' : v + '%'},
    grid:baseGrid(34),
    xAxis:Object.assign({type:'category', data:rlabels}, baseAxis(tc)),
    yAxis:{type:'value', max:100, nameTextStyle:{color:tc.sub}, axisLabel:{color:tc.sub, fontSize:11, formatter:'{value}%'}, splitLine:{lineStyle:{color:tc.line}}},
    series:[{type:'line', data:rdata, symbol:'circle', symbolSize:6, smooth:true,
      lineStyle:{width:2.4, color:tc.accent}, itemStyle:{color:tc.accent}}]
  });
  let tlabels = [], tdata = [];
  for(let i=5;i>=0;i--){
    const w = weekRange(i);
    tlabels.push((w.start.getMonth()+1) + '/' + w.start.getDate());
    tdata.push(tradeCount(w.from, w.to));
  }
  const goal = store.goals.freqOn ? store.goals.freqValue : null;
  const seriesTrade = {type:'bar', data:tdata, barWidth:'48%', itemStyle:{color:tc.up, borderRadius:[4,4,0,0]}};
  if(goal){
    seriesTrade.markLine = {silent:true, symbol:'none', lineStyle:{color:tc.sub, type:'dashed', width:1.4},
      label:{formatter:'目标 ' + goal, color:tc.sub, fontSize:11, position:'insideEndTop'},
      data:[{yAxis:goal}]};
  }
  initChart('chartTrade', {
    tooltip:{trigger:'axis', confine:true, valueFormatter:v => v + ' 次'},
    grid:baseGrid(34),
    xAxis:Object.assign({type:'category', data:tlabels}, baseAxis(tc)),
    yAxis:Object.assign({type:'value', name:'次数', nameTextStyle:{color:tc.sub}}, baseAxis(tc)),
    series:[seriesTrade]
  });
}

const lazyObs = {};
function watchSentinel(id, cb, hasMore){
  if(lazyObs[id]){ clearInterval(lazyObs[id].iv); delete lazyObs[id]; }
  if(!hasMore) return;
  const el = document.getElementById(id);
  if(!el) return;
  const fn = () => {
    const view = el.closest('.view');
    if(view && getComputedStyle(view).display === 'none') return;
    const r = el.getBoundingClientRect();
    if(r.height > 0 && r.top < innerHeight + 260) cb();
  };
  fn();
  lazyObs[id] = {iv: setInterval(fn, 500)};
}

function filteredNotes(){
  const f = ui.noteFilter || (ui.noteFilter = {q:'', sector:'', op:'', wrong:false, hl:false});
  const kw = f.q.trim().toLowerCase();
  return store.notes.filter(n => {
    if(kw && !(n.stock||'').toLowerCase().includes(kw) && !(n.sector||'').toLowerCase().includes(kw) &&
       !(n.content||'').toLowerCase().includes(kw)) return false;
    if(f.sector && n.sector !== f.sector) return false;
    if(f.op && n.opType !== f.op) return false;
    if(f.wrong && !n.wrong) return false;
    if(f.hl && !(n.content||'').includes('==')) return false;
    return true;
  }).sort((a,b) => b.date.localeCompare(a.date));
}

function fundModal(type){
  const isIn = type === 'in';
  openModal(
    '<h3>' + (isIn ? '转入资金' : '转出资金') + '</h3>' +
    '<p style="font-size:13px;color:var(--sub);margin:-8px 0 14px">' + (isIn ? '从银行卡转入，总资产与可用资金将增加' : '转出到银行卡，总资产与可用资金将减少') + '</p>' +
    '<div class="form-item"><label class="form-label">金额（元）</label><input class="field" type="number" inputmode="decimal" id="fmAmount" placeholder="如 50000"></div>' +
    '<div class="form-item"><label class="form-label">备注（可选）</label><input class="field" id="fmNote" maxlength="30" placeholder="如：工资入金 / 转出还贷"></div>' +
    '<div class="modal-foot"><button class="btn" data-x>取消</button><button class="btn btn-primary" id="fmSave">确认' + (isIn?'转入':'转出') + '</button></div>'
  );
  $('#fmSave').addEventListener('click', () => {
    const amt = num($('#fmAmount').value);
    if(amt == null || amt <= 0){ toast('请输入有效的金额'); return; }
    if(!store.account) store.account = {totalAssets: null};
    if(isIn){
      store.account.totalAssets = (store.account.totalAssets || 0) + amt;
    } else {
      if(store.account.totalAssets == null){ toast('请先在账户信息中录入总资产'); return; }
      const av = acctCalc().available;
      if(av == null || av < amt){ toast('可用资金不足，无法转出'); return; }
      store.account.totalAssets -= amt;
    }
    store.fundFlows.push({id:uid(), date:todayStr(), type: isIn?'in':'out', amount: Math.round(amt*100)/100, note:$('#fmNote').value.trim()});
    save(); closeModal(); renderSettings(); renderHome(); toast((isIn?'已转入 ':'已转出 ') + fmtMoney(amt));
  });
}

function importBackup(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if(!d || typeof d !== 'object' || (!Array.isArray(d.holdings) && !Array.isArray(d.tasks))) throw 0;
      store = loadStore();
      Object.keys(d).forEach(k => {
        if(k === 'account') return;
        else if(k === 'holdings') store.holdings = Array.isArray(d.holdings) ? d.holdings : [];
        else if(k === 'closedTrades') store.closedTrades = Array.isArray(d.closedTrades) ? d.closedTrades : [];
        else if(k === 'fundFlows') store.fundFlows = Array.isArray(d.fundFlows) ? d.fundFlows : [];
        else if(k === 'dailyPnl' && d.dailyPnl && typeof d.dailyPnl === 'object') store.dailyPnl = d.dailyPnl;
        else if(k === 'timerLogs') store.timerLogs = Array.isArray(d.timerLogs) ? d.timerLogs : [];
        else if(k === 'reviews') store.reviews = Array.isArray(d.reviews) ? d.reviews : [];
        else if(k === 'notes') store.notes = Array.isArray(d.notes) ? d.notes : [];
        else if(k === 'goals') store.goals = Object.assign({}, store.goals, d.goals);
        else if(k === 'pomodoro') store.pomodoro = Object.assign({}, store.pomodoro, d.pomodoro);
        else if(k === 'autoDark') store.autoDark = Object.assign({}, store.autoDark, d.autoDark);
        else if(k === 'theme') store.theme = THEMES.some(x=>x.k===d.theme) ? d.theme : store.theme;
        else if(k === 'reviewAI') store.reviewAI = Object.assign({daily:null, plan:null, news:null, lhb:null}, d.reviewAI);
      });
      if(d.account){
        if(d.account.totalAssets != null) store.account = {totalAssets: d.account.totalAssets};
        else if(d.account.available != null) store.account = {totalAssets: d.account.available + acctCalc().cost};
      }
      store.lastRoute = '#/' + currentRoute();
      save(); render(); toast('数据已导入');
    }catch(err){ toast('备份文件无效，导入失败'); }
  };
  reader.readAsText(file);
}

function download(name, text){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ============ 弹窗 / 提示 ============ */
function openModal(html, wide){
  const mask = $('#modalMask');
  $('#modalBody').innerHTML = html;
  $('#modalBody').classList.toggle('wide', !!wide);
  mask.hidden = false;
  requestAnimationFrame(() => mask.classList.add('show'));
  $$('#modalMask [data-x]').forEach(b => b.addEventListener('click', closeModal));
  bindEl('modalClose', closeModal);
  mask.onclick = e => { if(e.target === mask) closeModal(); };
}
function closeModal(){
  const mask = $('#modalMask');
  $('#modalBody').classList.remove('wide');
  mask.classList.remove('show');
  mask.hidden = true;
}
function confirmDialog(title, msg, okText, danger){
  return new Promise(res => {
    openModal('<h3>' + title + '</h3>' +
      '<p style="font-size:14px;line-height:1.8;color:var(--text);margin:6px 0 4px">' + msg + '</p>' +
      '<div class="modal-foot"><button class="btn" data-x>取消</button><button class="btn ' + (danger?'btn-danger':'btn-primary') + '" id="cfOk">' + okText + '</button></div>');
    bindEl('cfOk', () => { closeModal(); res(true); });
    $$('#modalMask [data-x]').forEach(b => b.addEventListener('click', () => res(false)));
  });
}
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function notify(title, body){
  try{
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    new Notification(title, {body});
  }catch(e){}
}
function bindEl(id, fn){
  const el = document.getElementById(id);
  if(el && fn) el.addEventListener('click', fn);
  return el;
}

    const hint = document.createElement('div');
    hint.id = 'gudaoPullHint';
    hint.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 4v12m0 0l-5-5m5 5l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>下拉刷新</span>';
    document.body.appendChild(hint);
    const txt = hint.querySelector('span');
    let st = null;
    const MAX = 96, TRIG = 56;
    const reset = () => {
      st = null;
      hint.classList.remove('show', 'spin');
      hint.style.transform = '';
      hint.style.opacity = '';
    };
    const paint = (dist, label, spin) => {
      hint.classList.add('show');
      hint.classList.toggle('spin', !!spin);
      txt.textContent = label;
      hint.style.transform = 'translateX(-50%) translateY(' + (dist * 0.45) + 'px)';
      hint.style.opacity = String(Math.min(1, dist / TRIG));
    };
    window.addEventListener('touchstart', e => {
      if(st) return;
      if((document.scrollingElement || document.documentElement).scrollTop > 4) return;
      if(e.touches[0].clientY > 90) return;
      st = {y: e.touches[0].clientY, d: 0};
    }, {passive: true});
    window.addEventListener('touchmove', e => {
      if(!st || st.refreshing) return;
      const dy = e.touches[0].clientY - st.y;
      if(dy <= 0){ reset(); return; }
      e.preventDefault();
      st.d = dy;
      const dist = Math.min(MAX, dy * 0.55);
      paint(dist, dist >= TRIG ? '释放刷新' : '下拉刷新', false);
    }, {passive: false});
    window.addEventListener('touchend', () => {
      if(!st || st.refreshing) return;
      if(st.d >= TRIG){
        st.refreshing = true;
        paint(TRIG * 0.8, '刷新中…', true);
        render();
        if(document.getElementById('idxList')) loadIndexCard(true, true);
        setTimeout(reset, 650);
      } else {
        reset();
      }
    });
  })();
  render();
}
document.addEventListener('DOMContentLoaded', init);
function runSplash(){
  const sp = document.getElementById('splash');
  if(!sp) return;
  if(sessionStorage.getItem('gd_splash')){
    sp.remove();
    return;
  }
  sessionStorage.setItem('gd_splash', '1');
  setTimeout(() => sp.classList.add('out'), 1350);
  setTimeout(() => sp.remove(), 1900);
}
</script>
